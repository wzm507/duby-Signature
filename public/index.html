<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature Homes</title>
    <link rel="icon" href="/img/logo2.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf9 100%);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #333;
            line-height: 1.6;
        }
        
        /* 英雄区域样式 */
        .hero {
            position: relative;
            color: white;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.3));
            z-index: 2;
        }
        
        /* 视频样式 */
        .hero-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        /* 轮播指示器样式 - 已移除 */
        .carousel-indicators {
            display: none;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            /* 响应式样式 */
        }
        
        .hero-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 3;
            max-width: 800px;
            padding: 2rem;
            background-color: rgba(0, 0, 0, 0.4); /* 半透明黑色背景遮罩 */
            border-radius: 12px; /* 添加圆角，增强视觉效果 */
        }
        
        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            text-shadow: 0 3px 20px rgba(0, 0, 0, 0.8); /* 增强阴影效果 */
            white-space: normal;
            line-height: 1.2;
            font-weight: bold; /* 增加字体粗细 */
            color: white; /* 明确设置白色文本，确保在深色背景上清晰可见 */
        }
        
        /* 响应式字体大小 */
        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 2.5rem;
            }
        }
        
        /* 导航栏样式 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100% !important;
            min-width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            padding: 1.5rem 2rem !important;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: transparent;
            backdrop-filter: blur(10px);
            box-shadow: none;
            z-index: 1000;
            box-sizing: border-box !important;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
            text-decoration: none;
        }
        
        .nav-links {
          display: flex;
          gap: 3rem;
          align-items: center;
      }
        

        
        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .nav-links a:hover {
            color: #6c63ff;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 2.5rem;
            }
        }
        
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: modalFadeIn 0.3s ease-out;
        }
        
        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-close {
            position: absolute;
            right: 1rem;
            top: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .modal-close:hover {
            color: #6c63ff;
        }
        
        .modal-body {
            text-align: center;
        }
        
        /* 响应式弹窗 */
        @media (max-width: 768px) {
            .modal-content {
                margin: 30% auto;
                padding: 1.5rem;
                width: 95%;
            }
        }
        
        /* Call Us按钮样式 */
        .call-us-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #6c63ff, #5a54d8);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.4);
            z-index: 1000;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .call-us-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(108, 99, 255, 0.6);
        }
        
        .call-us-btn i {
            font-size: 1.2rem;
        }
        
        @media (max-width: 768px) {
             .call-us-btn {
                  bottom: 15px;
                  right: 15px;
                  padding: 0.8rem 1.2rem;
                  font-size: 0.9rem;
              }
          }
      </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="logo" style="display: flex; align-items: center;">
            <a href="/" style="display: flex; align-items: center;">
                <img src="/img/logo.png" alt="Logo" class="logo-image" style="width: 100px; height: auto;">
            </a>
        </div>
        <div class="nav-links" style="display: flex; gap: 3rem; align-items: center;">
            <a href="/featured-properties.html">Buy</a>
            <a href="/off-plan.html">Off-Plan</a>
            <a href="/communities.html">communities</a>
            <a href="/developers.html">Developers</a>
            <a href="/services.html">Services</a>
            <a href="/about.html">About Us</a>
        </div>
    </nav>
    
    <!-- 英雄区域，使用视频背景 -->
    <section class="hero">
        <!-- 视频背景 -->
        <video autoplay muted loop playsinline preload="auto" class="hero-video" id="heroVideo" poster="/img/banner/1.png">
            <source src="/sp/hero-video.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay"></div>
        <div id="hero-content" class="hero-content">
            <h1>Your Real Estate <br>Expert is Here.<br>Now you can find more than 200+ property choices with our professional agents! Contact us today to find your dream property.</h1>
            <!-- 筛选按钮区域 -->
            <div class="filter-container" style="margin-top: 1rem; display: flex; justify-content: center; gap: 1rem;">
                <button class="filter-btn active" data-filter="buy" 
                        style="background-color: #6c63ff; border: 2px solid #6c63ff; color: white; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s ease; min-width: 120px; text-align: center; box-shadow: 0 4px 12px rgba(108,99,255,0.3); transform: translateY(-2px);">
                    Buy
                </button>
                <button class="filter-btn" data-filter="rent" 
                        style="background-color: white; border: 2px solid #6c63ff; color: #6c63ff; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s ease; min-width: 120px; text-align: center; box-shadow: 0 2px 8px rgba(108,99,255,0.1);">
                    Rent
                </button>
            </div>
            
            <div class="search-container" style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
                <input type="text" class="search-input" placeholder="Search properties by location, type, or price..." 
                       style="padding: 1rem 1.5rem; border: none; border-radius: 50px; font-size: 1rem; width: 400px; max-width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.1); outline: none;">
                <button class="search-button" 
                        style="padding: 1rem 2rem; border: none; border-radius: 50px; background: #6c63ff; color: white; font-size: 1rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(108,99,255,0.3);">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            
            <script>
                // 筛选按钮切换功能
                document.addEventListener('DOMContentLoaded', function() {
                    const filterBtns = document.querySelectorAll('.filter-btn');
                    const searchInput = document.querySelector('.search-input');
                    const searchButton = document.querySelector('.search-button');
                    
                    // 筛选按钮切换逻辑
                    filterBtns.forEach(btn => {
                        btn.addEventListener('click', function() {
                            // 移除所有按钮的active类
                            filterBtns.forEach(b => {
                                b.classList.remove('active');
                                b.style.backgroundColor = 'white';
                                b.style.color = '#6c63ff';
                                b.style.boxShadow = '0 2px 8px rgba(108,99,255,0.1)';
                                b.style.transform = 'none';
                            });
                            
                            // 添加当前按钮的active类
                            this.classList.add('active');
                            this.style.backgroundColor = '#6c63ff';
                            this.style.color = 'white';
                            this.style.boxShadow = '0 4px 12px rgba(108,99,255,0.3)';
                            this.style.transform = 'translateY(-2px)';
                        });
                    });
                    
                    // 搜索功能
                    function handleSearch() {
                        // 获取当前选中的筛选条件
                        const selectedFilter = document.querySelector('.filter-btn.active').getAttribute('data-filter');
                        // 获取搜索关键词
                        const searchTerm = searchInput.value.trim();
                        
                        // 根据筛选条件跳转到对应的页面
                        if (selectedFilter === 'buy') {
                            if (searchTerm) {
                                window.location.href = `featured-properties.html?search=${encodeURIComponent(searchTerm)}`;
                            } else {
                                window.location.href = 'featured-properties.html';
                            }
                        } else if (selectedFilter === 'rent') {
                            if (searchTerm) {
                                window.location.href = `rent.html?search=${encodeURIComponent(searchTerm)}`;
                            } else {
                                window.location.href = 'rent.html';
                            }
                        }
                    }
                    
                    // 搜索按钮点击事件
                    searchButton.addEventListener('click', handleSearch);
                    
                    // 回车键搜索
                    searchInput.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') {
                            handleSearch();
                        }
                    });
                });
            </script>
        </div>
    </section>

    <!-- Call Us弹窗 -->
    <div id="callUsModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-body">
                <h3 style="margin-bottom: 1.5rem; color: #6c63ff;">Contact Us</h3>
                <p style="font-size: 1.5rem; font-weight: 700; color: #6c63ff; text-align: center;">+971 52 145 0498</p>
                <p style="margin-top: 1rem; color: #666; text-align: center; cursor: pointer;" onclick="copyPhoneNumber()">Click to copy phone number</p>
            </div>
        </div>
    </div>

    <!-- Call Us悬浮按钮 -->
    <button class="call-us-btn" onclick="openCallUsModal()">
        <i class="fas fa-phone"></i>
        Call Us
    </button>
    
    <script>
        // 视频播放功能
        document.addEventListener('DOMContentLoaded', function() {
            const heroVideo = document.getElementById('heroVideo');
            if (heroVideo) {
                heroVideo.play().catch(function(e) {
                    console.log('视频播放被阻止:', e);
                });
            }
        });

        // Call Us弹窗功能
        function openCallUsModal() {
            const modal = document.getElementById('callUsModal');
            modal.style.display = 'block';
        }

        function closeCallUsModal() {
            const modal = document.getElementById('callUsModal');
            modal.style.display = 'none';
        }

        function copyPhoneNumber() {
            const phoneNumber = '+971 52 145 0498';
            navigator.clipboard.writeText(phoneNumber).then(() => {
                const message = event.target;
                const originalText = message.textContent;
                message.textContent = 'Phone number copied!';
                message.style.color = '#6c63ff';
                setTimeout(() => {
                    message.textContent = originalText;
                    message.style.color = '#666';
                }, 2000);
            });
        }

        // 弹窗事件监听
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('callUsModal');
            const closeBtn = document.querySelector('.modal-close');

            // 关闭按钮事件
            closeBtn.addEventListener('click', closeCallUsModal);

            // 点击弹窗外部关闭
            window.addEventListener('click', function(event) {
                if (event.target === modal) {
                    closeCallUsModal();
                }
            });

            // ESC键关闭弹窗
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && modal.style.display === 'block') {
                    closeCallUsModal();
                }
            });
        });
    </script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
