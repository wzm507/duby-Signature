<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        .hero-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-fallback-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('/img/banner/1.png');
            background-size: cover;
            background-position: center;
        }
        
        .status {
            position: fixed;
            top: 100px;
            left: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.8);
            color: white;
            z-index: 9999;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="hero">
        <video id="heroVideo" autoplay muted loop playsinline preload="auto">
            <source src="/sp/微信视频2025-12-22_141740_457.mp4" type="video/mp4">
        </video>
        <div class="video-fallback-image" id="videoFallback"></div>
        <div class="status" id="status">Status: Loading...</div>
    </div>
    
    <script>
        const heroVideo = document.getElementById('heroVideo');
        const videoFallback = document.getElementById('videoFallback');
        const status = document.getElementById('status');
        
        function updateStatus(msg) {
            status.textContent = 'Status: ' + msg;
            console.log(msg);
        }
        
        heroVideo.addEventListener('loadstart', function() {
            updateStatus('Loading started');
        });
        
        heroVideo.addEventListener('loadedmetadata', function() {
            updateStatus('Metadata loaded - Duration: ' + heroVideo.duration + 's');
        });
        
        heroVideo.addEventListener('canplaythrough', function() {
            updateStatus('Can play through');
        });
        
        heroVideo.addEventListener('play', function() {
            updateStatus('Playing!');
            videoFallback.style.display = 'none';
        });
        
        heroVideo.addEventListener('error', function(e) {
            const errorCodes = {
                1: 'MEDIA_ERR_ABORTED',
                2: 'MEDIA_ERR_NETWORK',
                3: 'MEDIA_ERR_DECODE',
                4: 'MEDIA_ERR_SRC_NOT_SUPPORTED'
            };
            const code = errorCodes[heroVideo.error.code] || 'Unknown';
            updateStatus('Error: ' + code);
            videoFallback.style.display = 'block';
        });
        
        heroVideo.addEventListener('pause', function() {
            updateStatus('Paused');
        });
        
        window.addEventListener('load', function() {
            updateStatus('Page loaded');
        });
    </script>
</body>
</html>
