name: Deploy to Vercel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Debug Secrets
      run: |
        echo "VERCEL_TOKEN exists: ${{ secrets.VERCEL_TOKEN != '' }}"
        echo "ORG_ID exists: ${{ secrets.ORG_ID != '' }}"
        echo "PROJECT_ID exists: ${{ secrets.PROJECT_ID != '' }}"
      shell: bash

    - name: Deploy to Vercel
      uses: vercel/deploy@v3
      with:
        token: ${{ secrets.VERCEL_TOKEN }}
        org-id: ${{ secrets.ORG_ID }}
        project-id: ${{ secrets.PROJECT_ID }}
        vercel-args: '--prod --debug'